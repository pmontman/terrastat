[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "terrastat"
version = "0.1.0"
description = "Polite, resumable gathering of public economic time series (FRED, Eurostat, OECD) into a tidy, license-aware Parquet database."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "polars>=1.20",
    "pyarrow>=18",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "tqdm>=4.66",
    "numpy>=1.26",
]

[project.optional-dependencies]
pandas = ["pandas>=2.2"]
notebook = ["jupyterlab>=4", "ipykernel>=6", "matplotlib>=3.8", "pandas>=2.2", "duckdb>=1.1", "nbformat>=5", "nbconvert>=7"]
dev = ["pytest>=8", "duckdb>=1.1"]

[project.urls]
Homepage = "https://github.com/pmontman/terrastat"
Repository = "https://github.com/pmontman/terrastat"
Issues = "https://github.com/pmontman/terrastat/issues"

[project.scripts]
terrastat = "terrastat.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# Bare `pytest` (what CI runs) does not put the repo root on sys.path; `python -m pytest` does.
# Declaring it here makes `from tests.test_corpus import ...` work the same way in both.
pythonpath = ["."]
testpaths = ["tests"]
